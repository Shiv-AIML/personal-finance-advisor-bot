{% extends "base.html" %}
{% block title %}Income{% endblock %}
{% block content %}
<div class="row g-4">
  <div class="col-lg-4"><div class="card"><div class="card-body">
    <h4>Add Income</h4>
    <form method="post">
      <label class="form-label">Amount</label><input class="form-control mb-3" type="number" step="0.01" min="0.01" name="amount" required>
      <label class="form-label">Source</label><input class="form-control mb-3" name="source" placeholder="Salary, Freelance..." required>
      <label class="form-label">Date</label><input class="form-control mb-3" type="date" name="entry_date" value="{{ today }}" required>
      <button class="btn btn-primary w-100">Add Income</button>
    </form>
  </div></div></div>
  <div class="col-lg-8"><div class="card"><div class="card-body">
    <h4>Income Records</h4>
    <div class="table-responsive"><table class="table align-middle">
      <thead><tr><th>Date</th><th>Source</th><th>Amount</th><th></th></tr></thead>
      <tbody>{% for x in incomes %}<tr><td>{{ x.entry_date }}</td><td>{{ x.source }}</td><td>₹{{ "%.2f"|format(x.amount) }}</td><td><form method="post" action="{{ url_for('delete_income', income_id=x.id) }}"><button class="btn btn-sm btn-outline-danger">Delete</button></form></td></tr>{% else %}<tr><td colspan="4">No income records.</td></tr>{% endfor %}</tbody>
    </table></div>
  </div></div></div>
</div>
{% endblock %}
